name: "postcode_decoding"
description: Sort SAM/BAM/CRAM file
keywords:
  - spatial transcriptomics
  - decoding
  - postcode
  - probabilistic decoding
components:
  - postcode/preprocess
  - postcode/decode
  - postcode/postprocess
input:
  - ch_input:
      type: file
      description: |
        The input channel containing, per entry, everything needed to preprocess,
        decode and postprocess one profile. Bundling all of these into a single
        tuple (rather than joining separate per-argument channels by meta inside
        the subworkflow) lets the caller decide how to pair a shared resource
        (e.g. a single codebook reused for every profile) with each profile,
        instead of silently dropping items that don't share an identical meta.
        Structure: [ val(meta), path(profile), path(tab_codebook), path(readout), val(R), path(localisation) ]
      pattern: "*.{npy,csv,tsv,xlsx}"

output:
  - decoding_result:
      type: file
      description: |
        Channel containing decoded results
        Structure: [ val(meta), path(csv) ]
      pattern: "*.csv"
  - processed_profiles:
      type: file
      description: |
        Channel containing reformatted profile files
        Structure: [ val(meta), path(profile) ]
      pattern: "*.npy"
  - versions:
      type: file
      description: |
        File containing software versions
        Structure: [ path(versions.yml) ]
      pattern: "versions.yml"
authors:
  - "@BioinfoTongLI"
maintainers:
  - "@BioinfoTongLI"
