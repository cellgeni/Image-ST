# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/meta-schema.json
name: "imaging_microaligner"
description: Register multi-cycle microscopy images using feature-based and optical flow methods.
keywords:
  - imaging
  - registration
  - microscopy
  - alignment
tools:
  - "microaligner":
      description: "Automated registration of large-scale multi-cycle microscopy images using feature-based and optical flow methods."
      homepage: "https://github.com/VasylVaskivskyi/microaligner"
      documentation: "https://github.com/VasylVaskivskyi/microaligner"
      tool_dev_url: "https://github.com/VasylVaskivskyi/microaligner"
      licence:
        - "GPL-3.0"

input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. `[ id:'sample1' ]`
    - config:
        type: file
        description: MicroAligner YAML configuration file describing registration parameters and inputs.
        pattern: "*.{yml,yaml}"
    - images:
        type: file
        description: Image files referenced by the configuration file to be registered.
  - - method:
        type: string
        description: Registration method to run, e.g. `feature` or `optflow`.

output:
  registered_image:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'sample1' ]`
      - "${prefix}_${method}_reg_result_stack.tif":
          type: file
          description: Registered image stack produced by MicroAligner.
          pattern: "*_reg_result_stack.tif"

  versions_microaligner:
    - - "${task.process}":
          type: string
          description: The name of the process
      - "microaligner":
          type: string
          description: The name of the tool
      - "microaligner --version 2>&1 | sed 's/^.*microaligner //; s/Using.*$//'":
          type: eval
          description: The expression to obtain the tool version

topics:
  versions:
    - - ${task.process}:
          type: string
          description: The name of the process
      - microaligner:
          type: string
          description: The name of the tool
      - microaligner --version 2>&1 | sed 's/^.*microaligner //; s/Using.*$//':
          type: eval
          description: The expression to obtain the tool version

authors:
  - "@VasylVaskivskyi"
  - "@BioinfoTongLI"
maintainers:
  - "@BioinfoTongLI"
